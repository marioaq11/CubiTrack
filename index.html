<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubiTrack</title>
</head>


<body>
    <body>

    <!-- Main application container -->
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                CubiTrack
            </div>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Simulations</a>
                <a href="#">Boxes</a>
                <a href="#">Pallets</a>
                <a href="#">Reports</a>
            </nav>

        </aside>


        <!-- Main content -->
        <main class="main-content">

            <header class="topbar">

                <h1>Dashboard</h1>

                <span class="user">
                    👤 User
                </span>

            </header>


            <!-- Metrics -->
            <section class="metrics">

                <div class="metric-card">
                    <h2>18</h2>
                    <p>Simulations</p>
                </div>

                <div class="metric-card">
                    <h2>91.4%</h2>
                    <p>Average Utilization</p>
                </div>

                <div class="metric-card">
                    <h2>12,540</h2>
                    <p>Total Boxes</p>
                </div>

            </section>


            <!-- Recent simulations -->
            <section class="simulations">

                <h2>Recent Simulations</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Pallet</th>
                            <th>Utilization</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>Customer A</td>
                            <td>120 × 100 cm</td>
                            <td>91%</td>
                        </tr>

                        <tr>
                            <td>Customer B</td>
                            <td>120 × 100 cm</td>
                            <td>87%</td>
                        </tr>

                        <tr>
                            <td>Customer C</td>
                            <td>110 × 90 cm</td>
                            <td>82%</td>
                        </tr>

                    </tbody>

                </table>

            </section>

        </main>

    </div>

</body>
</body>
</html>
